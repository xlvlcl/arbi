name: Diagnostyka konfiguracji push
on:
  push:
    branches: [main]
    paths: ['.github/workflows/notification-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'diagnose: compare push configuration'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: github-pages
    env:
      ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
      ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
    steps:
      - name: Porownaj konfiguracje bez wysylania powiadomien
        run: |
          python -u - <<'PY'
          import json, os, time, urllib.request, urllib.error
          app=os.environ['ONESIGNAL_APP_ID'].strip();key=os.environ['ONESIGNAL_API_KEY'].strip()
          def get(url,auth=False):
              headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
              if auth:headers['Authorization']='Key '+key
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r:return json.load(r)
          try:
              web=get('https://xlvlcl.github.io/arbi/config.json?t='+str(int(time.time())))
              print('PUSH_DIAG_APP_ID_MATCH',web.get('onesignal_app_id')==app)
          except Exception as exc:print('PUSH_DIAG_WEB_ERROR',type(exc).__name__)
          try:
              data=get('https://api.onesignal.com/apps/'+app+'/segments',True)
              print('PUSH_DIAG_ALL_SEGMENTS',json.dumps([{k:s.get(k) for k in ('name','is_active')} for s in data.get('segments',[]) ]))
          except urllib.error.HTTPError as exc:print('PUSH_DIAG_SEGMENTS_HTTP',exc.code)
          except Exception as exc:print('PUSH_DIAG_SEGMENTS_ERROR',type(exc).__name__)
          PY
