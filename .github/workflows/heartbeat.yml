name: Surebet 2-Minute Heartbeat

on:
  schedule:
    # Off the top of the hour to reduce GitHub scheduler congestion.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: arbi-heartbeat-v28
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Wyzwalaj Surebet Scanner co 2 minuty
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${REPOSITORY}/dispatches"
          for n in 1 2 3 4 5 6 7 8; do
            echo "Heartbeat ${n}/8: $(date -u +%FT%TZ)"
            if ! curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "${endpoint}" \
              -d '{"event_type":"surebet_scan","client_payload":{"source":"heartbeat"}}'; then
              echo "::warning::Heartbeat ${n}/8 nie wyzwolił skanu; kolejna próba nastąpi za 2 minuty."
            fi
            if [ "$n" -lt 8 ]; then
              sleep 120
            fi
          done
