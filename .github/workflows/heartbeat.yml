name: Surebet 2-Minute Heartbeat

# v30: użytkownik ma własny zewnętrzny trigger co ~2 minuty.
# Ten workflow zostaje WYŁĄCZNIE do ręcznego testu, żeby nie dublować skanów.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arbi-heartbeat-v30
  cancel-in-progress: true

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wyzwól jeden testowy skan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 2 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPOSITORY}/dispatches" \
            -d '{"event_type":"surebet_scan","client_payload":{"source":"manual-heartbeat-test"}}'
