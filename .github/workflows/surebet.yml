name: Surebet Scanner Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BANKROLL_PLN: "50"
      MIN_PROFIT_PCT: "0.35"
      MAX_QUOTE_AGE_SECONDS: "180"

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Przygotuj Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Google Chrome:"
            google-chrome --version
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Uruchom skaner
        id: scanner
        continue-on-error: true
        run: python scanner.py

      - name: Pokaż diagnostykę
        if: always()
        run: |
          echo "===== diagnostics.json ====="
          if [ -f debug/diagnostics.json ]; then
            cat debug/diagnostics.json
          else
            echo "Brak debug/diagnostics.json"
          fi

          echo
          echo "===== landing.txt - pierwsze 120 linii ====="
          if [ -f debug/landing.txt ]; then
            sed -n '1,120p' debug/landing.txt
          else
            echo "Brak debug/landing.txt"
          fi

      - name: Zapisz screenshot i HTML jako artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dobrybuk-debug
          path: debug/
          if-no-files-found: warn
          retention-days: 3

      - name: Zatrzymaj workflow, jeśli skaner nie zadziałał
        if: steps.scanner.outcome != 'success'
        run: |
          echo "Skaner nie odczytał wydarzeń. Diagnostyka została zapisana w artefakcie dobrybuk-debug."
          exit 1

      - name: Skonfiguruj GitHub Pages
        if: steps.scanner.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Przygotuj stronę
        if: steps.scanner.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    runs-on: ubuntu-latest
    needs: scan
    if: needs.scan.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4
