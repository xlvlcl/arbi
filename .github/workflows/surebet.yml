name: Surebet Scanner

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      BANKROLL_PLN: "50"
      MIN_PROFIT_PCT: "0.35"

      MAX_EVENTS: "150"
      MAX_MARKETS_PER_EVENT: "40"

      SCAN_CONCURRENCY: "12"
      REQUEST_TIMEOUT: "18"

      DEDUPE_MINUTES: "30"

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchom skaner
        run: |
          python scanner.py

      - name: Pokaż wynik skanowania
        run: |
          echo "===== latest.json ====="
          cat docs/data/latest.json

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5

      - name: Przygotuj stronę
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: scan

    steps:
      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4
