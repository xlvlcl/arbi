name: Surebet Scanner

on:
  workflow_dispatch:
  repository_dispatch:
    types: [surebet_scan]
  schedule:
    # Awaryjny harmonogram. cron-job.org może nadal odpalać co 2 min.
    # Gate nie pozwala uruchomić dwóch pełnych skanów jednocześnie.
    - cron: "*/5 * * * *"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write


jobs:
  gate:
    name: Sprawdź czy skaner już działa
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
      blocker: ${{ steps.guard.outputs.blocker }}
    steps:
      - name: Nie twórz kolejki Pending
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          WORKFLOW_FILE: surebet.yml
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current = int(os.environ["CURRENT_RUN_ID"])
          workflow = os.environ["WORKFLOW_FILE"]

          url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              f"{workflow}/runs?per_page=30"
          )
          req = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "arbi-workflow-guard",
              },
          )

          blocker = None
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  payload = json.load(response)

              # Tylko STARSZY aktywny run blokuje nowy.
              # Dzięki temu dwa niemal równoczesne wywołania nie wystartują razem:
              # starsze dostaje pierwszeństwo, młodsze samo się kończy.
              active = [
                  run
                  for run in payload.get("workflow_runs", [])
                  if int(run.get("id", 0)) < current
                  and run.get("status") in {"in_progress", "queued"}
              ]
              if active:
                  blocker = max(active, key=lambda x: int(x.get("id", 0)))
          except Exception as exc:
              # Jeśli API GitHuba chwilowo nie odpowie, wolimy pozwolić na skan
              # niż całkowicie zatrzymać monitoring.
              print(f"Guard API warning: {type(exc).__name__}: {exc}")

          should_run = blocker is None
          blocker_id = str(blocker.get("id", "")) if blocker else ""

          print(
              "START skanu"
              if should_run
              else f"SKIP: starszy run #{blocker.get('run_number')} nadal działa"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"should_run={'true' if should_run else 'false'}\n")
              fh.write(f"blocker={blocker_id}\n")
          PY

  scan:
    name: Skanuj kursy
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 9

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BANKROLL_PLN: "50"
      MIN_PROFIT_PCT: "0.35"
      DEDUPE_MINUTES: "120"
      ALERT_REAPPEAR_MINUTES: "6"
      ALERT_IMPROVEMENT_PCT: "0.15"
      MAX_QUOTE_AGE_SECONDS: "300"
      MARKET_SCAN_MAX_EVENTS: "500"
      MARKET_SCAN_BUDGET_SECONDS: "300"
      MARKET_SCAN_CONCURRENCY: "6"
      MAX_MARKETS_PER_EVENT: "120"
      CONFIRM_CONCURRENCY: "3"
      DIRECT_SOURCES_TIMEOUT: "12"
      DIRECT_SOURCES_CONCURRENCY: "5"
      COUPON_CATALOG_LIMIT: "1600"
      VALUE_MIN_EDGE_PCT: "5.0"
      VALUE_MIN_REFERENCE_BOOKS: "5"
      VALUE_MAX_DISPERSION: "0.08"
      VALUE_MAX_PRICE_GAP: "0.30"
      VALUE_MIN_ODDS: "1.35"
      VALUE_MAX_ODDS: "8.0"
      VALUE_ALERT_COOLDOWN_MINUTES: "240"
      DEEP_SCAN_EVERY: "4"
      FAST_SCAN_MAX_EVENTS: "110"
      FAST_SCAN_BUDGET_SECONDS: "105"
      WATCH_SCAN_LIMIT: "50"
      WATCH_SCAN_SECONDS: "60"
      NEAR_ARB_GAP_PCT: "1.50"
      VALUE_STABILITY_SCANS: "1"
      VALUE_ELITE_EDGE_PCT: "9.0"
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
      ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
      APP_PUBLIC_URL: "https://xlvlcl.github.io/arbi/"

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sprawdź przeglądarkę
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Systemowy Google Chrome jest dostępny."
            google-chrome --version
          else
            echo "Brak systemowego Chrome - instaluję Chromium dla Playwright."
            python -m playwright install --with-deps chromium
          fi

      - name: Uruchom skaner wszystkich sportów, zdarzeń i rynków
        id: scanner
        continue-on-error: true
        run: python scanner.py

      - name: Zapisz diagnostykę jeśli źródło zwróci 0 wydarzeń
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surebet-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Przerwij jeśli skaner nie zadziałał
        if: steps.scanner.outcome != 'success'
        run: |
          echo "Skaner nie zakończył się poprawnie. Jeśli powstał artefakt surebet-debug, zawiera screenshot i HTML."
          exit 1

      - name: Sprawdź wynik
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("docs/data/latest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          stats = data.get("stats", {})
          print("STATS:", json.dumps(stats, ensure_ascii=False, indent=2))
          print("ERRORS:", json.dumps(data.get("errors", [])[-10:], ensure_ascii=False, indent=2))

          if stats.get("events", 0) <= 0:
              raise SystemExit("STOP: 0 wydarzeń")
          if stats.get("markets_scanned", 0) <= 0:
              raise SystemExit("STOP: 0 rynków")
          if not data.get("scan_preview"):
              raise SystemExit("STOP: brak scan_preview")
          if not data.get("coupon_catalog"):
              raise SystemExit("STOP: brak coupon_catalog")
          print("SCANNER:", stats.get("scanner"))
          print("SCAN MODE:", stats.get("scan_mode"))
          print("COUPON ITEMS:", len(data.get("coupon_catalog", [])))
          PY

      - name: Zapisz najnowsze dane do repozytorium
        shell: bash
        run: |
          set -u

          git config user.name "surebet-bot"
          git config user.email "surebet-bot@users.noreply.github.com"

          cp docs/data/latest.json /tmp/arbi-latest.json
          if [ -f data/state.json ]; then
            cp data/state.json /tmp/arbi-state.json
          fi

          success=0
          for attempt in 1 2 3; do
            echo "Próba zapisu danych: $attempt/3"

            git fetch origin main
            git reset --hard origin/main

            mkdir -p docs/data data
            cp /tmp/arbi-latest.json docs/data/latest.json
            if [ -f /tmp/arbi-state.json ]; then
              cp /tmp/arbi-state.json data/state.json
            fi

            git add docs/data/latest.json
            if [ -f data/state.json ]; then
              git add data/state.json
            fi

            if git diff --cached --quiet; then
              echo "Brak zmian danych do zapisania."
              success=1
              break
            fi

            git commit -m "data: refresh odds [skip ci]"

            if git push origin HEAD:main; then
              echo "Dane zapisane poprawnie."
              success=1
              break
            fi

            echo "Push nie udał się - ponawiam na świeżym origin/main."
            sleep $((attempt * 2))
          done

          if [ "$success" -ne 1 ]; then
            echo "::warning::Nie udało się zapisać latest.json do gałęzi main po 3 próbach."
            echo "::warning::Bieżący wynik nadal zostanie opublikowany przez GitHub Pages."
          fi

      # Publikuj Pages po KAŻDYM poprawnym skanie. Dzięki temu local data/latest.json
      # na stronie również zawsze jest świeży, nawet jeśli raw.githubusercontent.com cache'uje.
      - name: Wygeneruj blokadę hasłem
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          password = os.getenv("SITE_PASSWORD", "")
          if not password:
              raise SystemExit("STOP: brak sekretu SITE_PASSWORD. Strona nie zostanie opublikowana bez hasła.")
          from datetime import datetime, timezone

          digest = hashlib.sha256(password.encode("utf-8")).hexdigest()
          generated_at = datetime.now(timezone.utc).isoformat()
          Path("docs/auth-config.js").write_text(
              f'window.ARBI_AUTH_HASH = "{digest}";\n'
              f'window.ARBI_AUTH_GENERATED_AT = "{generated_at}";\n',
              encoding="utf-8",
          )
          print("Blokada hasłem: włączona; konfiguracja odświeżona")
          PY

      - name: Wygeneruj konfigurację aplikacji push
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          app_id = os.getenv("ONESIGNAL_APP_ID", "").strip()
          public_url = os.getenv("APP_PUBLIC_URL", "https://xlvlcl.github.io/arbi/").strip()
          Path("docs/push-config.js").write_text(
              "window.ARBI_ONESIGNAL_APP_ID = " + json.dumps(app_id) + ";\n"
              "window.ARBI_PUBLIC_URL = " + json.dumps(public_url) + ";\n",
              encoding="utf-8",
          )
          print("OneSignal Web Push:", "włączony" if app_id else "nie skonfigurowany")
          if not app_id:
              print("Dodaj sekret ONESIGNAL_APP_ID, aby włączyć powiadomienia z aplikacji.")
          PY

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5

      - name: Przygotuj stronę
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    runs-on: ubuntu-latest
    needs: scan
    if: needs.scan.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4
