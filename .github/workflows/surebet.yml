name: Surebet Scanner

on:
  workflow_dispatch:
  repository_dispatch:
    types: [surebet_scan]
  schedule:
    # GitHub Actions ma minimalny interwał cron około 5 minut.
    # Używamy przesunięcia od pełnej minuty, żeby zmniejszyć ryzyko kolejek.
    - cron: "3-58/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: surebet-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BANKROLL_PLN: "50"
      MIN_PROFIT_PCT: "0.35"
      MAX_QUOTE_AGE_SECONDS: "180"

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sprawdź przeglądarkę
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Systemowy Google Chrome jest dostępny."
            google-chrome --version
          else
            echo "Brak systemowego Chrome - instaluję Chromium dla Playwright."
            python -m playwright install --with-deps chromium
          fi

      - name: Uruchom skaner
        run: python scanner.py

      - name: Sprawdź wynik
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("docs/data/latest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          stats = data.get("stats", {})
          print("STATS:", stats)
          print("ERRORS:", data.get("errors", [])[-10:])

          if stats.get("events", 0) <= 0:
              raise SystemExit("STOP: 0 wydarzeń")
          if stats.get("markets", 0) <= 0:
              raise SystemExit("STOP: 0 rynków")
          PY

      - name: Zachowaj stan alertów
        shell: bash
        run: |
          if [ -f data/state.json ]; then
            git config user.name "surebet-bot"
            git config user.email "surebet-bot@users.noreply.github.com"
            git add data/state.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update alert state [skip ci]"
              git push
            fi
          fi

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5

      - name: Przygotuj stronę
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    runs-on: ubuntu-latest
    needs: scan
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4
