name: Surebet Scanner
run-name: Arbi NEW-1 — ${{ github.event_name }} — ${{ github.run_number }}
on:
  push:
    branches: [main]
    paths:
      - 'fresh/**'
      - '.github/workflows/surebet.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Opublikuj zmiany interfejsu lub konfiguracji strony
        type: boolean
        default: false
        required: false
  repository_dispatch:
    types: [surebet_scan]
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: arbi-from-zero-new1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scanner:
    name: Nowy skaner i publikacja
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      SOURCE_READER_URL: ${{ secrets.SOURCE_READER_URL }}
      SOURCE_READER_TOKEN: ${{ secrets.SOURCE_READER_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
      ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
      APP_PUBLIC_URL: https://xlvlcl.github.io/arbi/
      BANKROLL_PLN: '50'
      MIN_PROFIT_PCT: '0.35'
      SCAN_BUDGET_SECONDS: '85'
      DETAIL_LIMIT: '40'
      BOOKMAKER_TAX_OVERRIDES: '{}'
    defaults:
      run:
        shell: bash
    steps:
      - name: Pobierz nowy projekt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sprawdź obliczenia i cały przepływ
        run: |
          python -m unittest discover -s fresh/tests -p 'test_new.py' -v
          node --check fresh/web/app.js
          node fresh/tests/calculator.cjs
          node fresh/tests/web.cjs
          node --test fresh/reader/worker.test.mjs
      - name: Przygotuj konfigurację dostępu
        run: python fresh/build.py
      - name: Pobierz kursy, potwierdź okazje i wyślij alerty
        id: scan
        run: |
          set -euo pipefail
          if ! timeout --kill-after=5s 120s python -u fresh/scan.py 2>&1 | tee fresh/scan.log; then
            python fresh/scan.py --record-failure
            echo 'scan_state=error' >> "$GITHUB_OUTPUT"
          fi
      - name: Opublikuj świeży wynik w Cloudflare
        run: python fresh/publish_feed.py
      - name: Zachowaj wynik i historię alertów
        run: |
          set -euo pipefail
          git config user.name surebet-bot
          git config user.email surebet-bot@users.noreply.github.com
          worktree_dir="$RUNNER_TEMP/arbi-new-writeback-$GITHUB_RUN_ID"
          git fetch --no-tags origin main
          git worktree add --detach "$worktree_dir" origin/main
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git -C "$worktree_dir" reset --hard origin/main
            mkdir -p "$worktree_dir/fresh/web/data"
            for file in fresh/web/data/latest.json fresh/state.json; do
              if [ -f "$file" ]; then
                cp "$file" "$worktree_dir/$file"
                git -C "$worktree_dir" add -f -- "$file"
              fi
            done
            if git -C "$worktree_dir" diff --cached --quiet; then
              exit 0
            fi
            git -C "$worktree_dir" commit -m 'data: new scanner result [skip ci]'
            if git -C "$worktree_dir" push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo '::error::Nie udało się zapisać wyniku. Sprawdź prawa zapisu Actions do main.'
          exit 1
      - name: Skonfiguruj Pages
        if: github.event_name == 'push' || inputs.publish == true
        uses: actions/configure-pages@v5
      - name: Przygotuj nową stronę
        if: github.event_name == 'push' || inputs.publish == true
        uses: actions/upload-pages-artifact@v3
        with:
          path: fresh/web
      - name: Opublikuj nową stronę
        if: github.event_name == 'push' || inputs.publish == true
        id: deployment
        timeout-minutes: 5
        uses: actions/deploy-pages@v4
      - name: Zapisz log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbi-new-log-${{ github.run_id }}
          path: fresh/scan.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Pokaż stan skanera
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('fresh/web/data/latest.json')
          if p.exists():
              data=json.loads(p.read_text('utf-8'))
              status=data.get('status',{})
              text='## Arbi NEW-1\n\n'+str(status.get('state'))+' — '+str(status.get('message'))+'\n\n'+json.dumps(data.get('stats',{}),ensure_ascii=False)+'\n'
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:f.write(text)
              print(text)
          PY
      - name: Zgłoś nieudaną próbę po publikacji statusu
        if: steps.scan.outputs.scan_state == 'error'
        run: |
          echo '::error::Źródło nie zwróciło poprawnego wyniku. Aktualny komunikat został opublikowany na stronie; sprawdź log.'
          exit 1
