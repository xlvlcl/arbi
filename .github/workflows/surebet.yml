name: Surebet Scanner

on:
  workflow_dispatch:
  repository_dispatch:
    types: [surebet_scan]
  schedule:
    # Zapasowy harmonogram. GitHub potrafi go opóźniać, dlatego docelowo
    # dodatkowo wyzwalamy ten sam workflow z cron-job.org co 5 minut.
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: surebet-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BANKROLL_PLN: "50"
      MIN_PROFIT_PCT: "0.35"
      MAX_QUOTE_AGE_SECONDS: "300"
      MARKET_SCAN_MAX_EVENTS: "500"
      MARKET_SCAN_BUDGET_SECONDS: "240"
      MARKET_SCAN_CONCURRENCY: "6"
      MAX_MARKETS_PER_EVENT: "60"
      CONFIRM_CONCURRENCY: "3"

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sprawdź przeglądarkę
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Systemowy Google Chrome jest dostępny."
            google-chrome --version
          else
            echo "Brak systemowego Chrome - instaluję Chromium dla Playwright."
            python -m playwright install --with-deps chromium
          fi

      - name: Uruchom skaner wszystkich sportów, zdarzeń i rynków
        id: scanner
        continue-on-error: true
        run: python scanner.py

      - name: Zapisz diagnostykę jeśli źródło zwróci 0 wydarzeń
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surebet-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Przerwij jeśli skaner nie zadziałał
        if: steps.scanner.outcome != 'success'
        run: |
          echo "Skaner nie zakończył się poprawnie. Jeśli powstał artefakt surebet-debug, zawiera screenshot i HTML."
          exit 1

      - name: Sprawdź wynik
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("docs/data/latest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          stats = data.get("stats", {})
          print("STATS:", json.dumps(stats, ensure_ascii=False, indent=2))
          print("ERRORS:", json.dumps(data.get("errors", [])[-10:], ensure_ascii=False, indent=2))

          if stats.get("events", 0) <= 0:
              raise SystemExit("STOP: 0 wydarzeń")
          if stats.get("markets_scanned", 0) <= 0:
              raise SystemExit("STOP: 0 rynków szczegółowych")
          PY

      - name: Zapisz najnowsze dane od razu do repozytorium
        shell: bash
        run: |
          git config user.name "surebet-bot"
          git config user.email "surebet-bot@users.noreply.github.com"
          git add docs/data/latest.json
          if [ -f data/state.json ]; then
            git add data/state.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "data: refresh odds [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Brak zmian danych do zapisania."
          fi

      # Strona sama czyta świeże latest.json z gałęzi main co 3 sekundy.
      # Dzięki temu kolejne skany nie muszą czekać na deployment Pages.
      - name: Skonfiguruj GitHub Pages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Przygotuj stronę
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    runs-on: ubuntu-latest
    needs: scan
    if: github.event_name == 'workflow_dispatch' && needs.scan.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4
